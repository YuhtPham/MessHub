name: Build and publish MessHub Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build and attach files to (for example v1.6.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            os: ubuntu-latest
            artifact_name: linux-build
            command: npm run build -- --publish never
            patterns: |
              MessHub Client-*-linux-x64.AppImage
              latest-linux.yml
          - platform: Windows x64
            os: windows-latest
            artifact_name: windows-build
            command: npm run build:win -- --publish never
            patterns: |
              MessHub Client-Setup-*.exe
              *.blockmap
              latest.yml
          - platform: macOS
            os: macos-latest
            artifact_name: macos-build
            command: npm run build:mac -- --publish never
            patterns: |
              *.dmg
              *.zip
              *.blockmap
              latest-mac.yml

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenjp2-tools

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches release tag
        shell: bash
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v (received: $RELEASE_TAG)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build application
        run: ${{ matrix.command }}

      - name: Upload platform build files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.patterns }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-assets/linux

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-assets/windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: release-assets/macos

      - name: Add Linux installer script
        run: cp install.sh release-assets/install.sh

      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/linux/*
            release-assets/windows/*
            release-assets/macos/*
            release-assets/install.sh
